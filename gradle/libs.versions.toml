# COUI17 version catalog. No SNAPSHOT / dynamic versions.
# Upstream coui17 is built against AGP 9.3.1 / Kotlin 2.4.10 / Compose Multiplatform 1.11.1; this
# repository builds the same sources with the toolchain below.

[versions]
agp = "9.5.2"
kotlin = "2.4.21"
compose-multiplatform = "1.12.2"
androidx-compose = "1.13.0"

# Library runtime dependencies
androidx-navigationevent = "1.2.0"
jetbrains-compose-window-size = "1.9.0"
materialkolor-utilities = "5.0.1"  # 6.x removes DynamicScheme, which the theme's Monet mapping uses
androidx-core = "1.19.1"
# coui-nav
androidx-lifecycle = "2.11.1"
kotlinx-serialization = "1.13.0"

# Gallery
androidx-activity = "1.13.0"

# Tests
junit4 = "4.13.2"

[libraries]
jetbrains-compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose-multiplatform" }
jetbrains-compose-window-size = { module = "org.jetbrains.compose.material3:material3-window-size-class", version.ref = "jetbrains-compose-window-size" }
androidx-navigationevent = { module = "androidx.navigationevent:navigationevent-compose", version.ref = "androidx-navigationevent" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
materialkolor-utilities = { module = "com.materialkolor:material-color-utilities", version.ref = "materialkolor-utilities" }

androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-compose-ui = { module = "androidx.compose.ui:ui", version.ref = "androidx-compose" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation", version.ref = "androidx-compose" }

junit4 = { module = "junit:junit", version.ref = "junit4" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
androidKotlinMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
